<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Places to visit in Brazil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/sign-in.css">
</head>
<body>
<header>
  <div class="logo-sign">
    <h1>Places to visit in Brazil</h1>
    <a href="sign-up.html">
      Create account
    </a>

  </div>
</header>
<main class="container">
      <div class="sign">
        <form method="post" action="../index.html" class="sign-in" >
            <div class="sign-in-input">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>
            <div class="sign-in-input">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

          <button type="submit" class="sign-in-btn">Sign-in</button>
        </form>

      </div>

</main>
</body>
</html>
